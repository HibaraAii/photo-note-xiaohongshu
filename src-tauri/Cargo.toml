[package]
name = "photo-note-xiaohongshu"
version = "0.1.0"
description = "Local-first photo notes"
authors = ["photo-note-xiaohongshu"]
edition = "2024"

[lib]
name = "photo_note_xiaohongshu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-camera-kessdev = "0.2.0-beta.3"
tauri-plugin-http = { version = "2", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "system-proxy",
] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
